<!DOCTYPE html>
<html lang="zh-Hant" data-theme="oled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#161311" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="富士食譜工具" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
  (function(){
    var KEY='polaroid-room-theme';
    var ok=['desk','space','wa','cn','pixel','scifi','oled'];
    try {
      var t=localStorage.getItem(KEY);
      if (ok.indexOf(t)!==-1) document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
  </script>
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <title>富士食譜工具</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    /* ==== 主題與玻璃：原樣取自「拍立得小房間」(polaroid.html)，兩頁共用同一組變數 ==== */
    :root {
      --desk:#F3EEE4;
      --desk-2:#E8E0D3;
      --card:#FAF7F1;
      --card-2:#F4EFE6;
      --ink:#2A241E;
      --muted:#8A7E72;
      --line:rgba(42,36,30,.12);
      --line-strong:rgba(42,36,30,.22);
      --paper:#FFFCFA;
      --cream:#2A241E;
      --sumi:#F3EEE4;
      --char:#EFE8DC;
      --panel:#FAF7F1;
      --panel-2:#F7F2EA;
      --fuji:#E26A3A;
      --fuji-dim:rgba(226,106,58,.18);
      --r-lg:18px; --r-md:14px; --r-sm:10px;
      --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
      --header-h:58px;
      --stage-bg:linear-gradient(180deg, #E7DFD2, #DDD4C5);
      --field-bg:#fff;
      --glow:rgba(255,255,255,.55);
      --shadow:0 10px 28px rgba(42,36,30,.06);
      --check-a:#d9d1c4; --check-b:#efe8dc;
    }

    html[data-theme="space"] {
      --desk:#070B16; --desk-2:#0B1222; --card:#10182A; --card-2:#0E1628;
      --ink:#E8EEFF; --muted:#8B97B8; --cream:#E8EEFF; --sumi:#070B16;
      --line:rgba(170,190,255,.16); --line-strong:rgba(170,190,255,.3);
      --paper:#0C1426; --char:#0C1426; --panel:#10182A; --panel-2:#141E34;
      --fuji:#8FB3FF; --fuji-dim:rgba(143,179,255,.22);
      --stage-bg:radial-gradient(circle at 20% 0%, #1B2A55, #070B16 62%);
      --field-bg:#0C1426; --glow:rgba(90,130,255,.28);
      --shadow:0 12px 32px rgba(0,0,0,.35);
      --check-a:#1A2440; --check-b:#0C1426;
    }
    html[data-theme="wa"] {
      --desk:#EDE4D4; --desk-2:#E4D8C4; --card:#F7F0E4; --card-2:#F3EAD9;
      --ink:#2A2420; --muted:#7A6E62; --cream:#2A2420; --sumi:#EDE4D4;
      --line:rgba(42,36,30,.14); --line-strong:rgba(42,36,30,.26);
      --paper:#FFF9F0; --char:#E8DCC8; --panel:#F7F0E4; --panel-2:#F3EAD9;
      --fuji:#9C2B2B; --fuji-dim:rgba(156,43,43,.16);
      --stage-bg:linear-gradient(180deg,#E6D8C2,#D9C9AF);
      --field-bg:#FFF9F0; --glow:rgba(255,250,240,.5);
      --shadow:0 10px 24px rgba(70,50,30,.08);
      --check-a:#D4C6AE; --check-b:#EDE4D4;
    }
    html[data-theme="cn"] {
      --desk:#F1E2C4; --desk-2:#E6D2A8; --card:#F8ECD0; --card-2:#F3E4C0;
      --ink:#1A120C; --muted:#7A6248; --cream:#1A120C; --sumi:#F1E2C4;
      --line:rgba(160,110,30,.28); --line-strong:rgba(160,110,30,.45);
      --paper:#FFF6DE; --char:#EAD6A8; --panel:#F8ECD0; --panel-2:#F3E4C0;
      --fuji:#C41A1A; --fuji-dim:rgba(196,26,26,.16);
      --stage-bg:linear-gradient(180deg,#E8D09A,#D4B36E);
      --field-bg:#FFF6DE; --glow:rgba(255,230,170,.45);
      --shadow:0 10px 24px rgba(90,40,10,.08);
      --check-a:#D9C08A; --check-b:#F1E2C4;
    }
    html[data-theme="pixel"] {
      --desk:#1B1528; --desk-2:#241C36; --card:#2A2140; --card-2:#32284C;
      --ink:#F4ECFF; --muted:#A894C4; --cream:#F4ECFF; --sumi:#1B1528;
      --line:rgba(255,255,255,.16); --line-strong:rgba(255,120,180,.45);
      --paper:#191326; --char:#191326; --panel:#2A2140; --panel-2:#32284C;
      --fuji:#FF4D8D; --fuji-dim:rgba(255,77,141,.22);
      --r-lg:0px; --r-md:0px; --r-sm:0px;
      --stage-bg:#120E1C;
      --field-bg:#191326; --glow:transparent;
      --shadow:4px 4px 0 #000;
      --check-a:#3A2E55; --check-b:#191326;
    }
    html[data-theme="scifi"] {
      --desk:#05070C; --desk-2:#080C16; --card:#0B1220; --card-2:#0E1730;
      --ink:#D7F7FF; --muted:#6FA8B8; --cream:#D7F7FF; --sumi:#05070C;
      --line:rgba(0,229,255,.22); --line-strong:rgba(0,229,255,.4);
      --paper:#071018; --char:#071018; --panel:#0B1220; --panel-2:#0E1730;
      --fuji:#00E5FF; --fuji-dim:rgba(0,229,255,.18);
      --stage-bg:linear-gradient(180deg,#071422,#05070C);
      --field-bg:#071018; --glow:rgba(0,229,255,.16);
      --shadow:0 0 24px rgba(0,229,255,.08);
      --check-a:#0C2230; --check-b:#071018;
    }
    html[data-theme="oled"] {
      --desk:#000; --desk-2:#000; --card:#000; --card-2:#050505;
      --ink:#EDEDED; --muted:#8A8A8A; --cream:#EDEDED; --sumi:#000;
      --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.22);
      --paper:#000; --char:#0A0A0A; --panel:#000; --panel-2:#050505;
      --fuji:#FF6A3A; --fuji-dim:rgba(255,106,58,.18);
      --stage-bg:#000;
      --field-bg:#000; --glow:transparent;
      --shadow:none;
      --check-a:#1A1A1A; --check-b:#000;
    }

    /* ==========================================================================
       Liquid Glass layer
       Everything below rides on top of the original styles. Each theme only
       defines tokens; the glass recipe itself is shared, so all seven themes get
       the same material with their own tint, rim light and ambient colour.
       ========================================================================== */
    :root{
      /* ambient light behind the glass */
      --amb-base:#EFE6D8;
      --blob-a:rgba(255,160,110,.55);
      --blob-b:rgba(255,212,140,.55);
      --blob-c:rgba(160,196,170,.40);
      --amb-texture:none;
      /* glass material */
      --g-blur:26px;
      --g-sat:1.8;
      --g-fill:rgba(255,252,246,.50);
      --g-fill-hi:rgba(255,253,249,.74);
      --g-well:rgba(255,255,255,.46);
      --g-sheen:rgba(255,255,255,.62);
      --g-rim:rgba(255,255,255,.95);
      --g-rim-low:rgba(255,255,255,.35);
      --g-edge:rgba(255,255,255,.55);
      --g-hair:rgba(42,36,30,.07);
      --g-shadow:0 1px 1px rgba(60,40,20,.04), 0 14px 34px -6px rgba(120,76,36,.16);
      --g-shadow-sm:0 1px 1px rgba(60,40,20,.05), 0 6px 14px -4px rgba(120,76,36,.18);
      --seg-on:rgba(255,255,255,.90);
      --seg-on-ink:var(--ink);
      --on-accent:#fff;
      --accent-glow:color-mix(in srgb, var(--fuji) 38%, transparent);
      --cap-r:24px;
      --spring:cubic-bezier(.34,1.5,.64,1);
    }
    html[data-theme="space"]{
      --amb-base:#060A18;
      --blob-a:rgba(78,110,255,.50);
      --blob-b:rgba(150,92,255,.40);
      --blob-c:rgba(40,190,220,.24);
      --amb-texture:
        radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.8) 50%, transparent 51%),
        radial-gradient(1px 1px at 68% 14%, rgba(255,255,255,.6) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 84% 62%, rgba(200,215,255,.7) 50%, transparent 51%),
        radial-gradient(1px 1px at 32% 78%, rgba(255,255,255,.5) 50%, transparent 51%),
        radial-gradient(1px 1px at 52% 44%, rgba(255,255,255,.45) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 6% 92%, rgba(255,255,255,.55) 50%, transparent 51%);
      --g-fill:rgba(18,26,52,.46);
      --g-fill-hi:rgba(26,36,70,.72);
      --g-well:rgba(4,8,22,.38);
      --g-sheen:rgba(190,210,255,.13);
      --g-rim:rgba(205,220,255,.42);
      --g-rim-low:rgba(205,220,255,.10);
      --g-edge:rgba(170,190,255,.16);
      --g-hair:rgba(170,190,255,.10);
      --g-shadow:0 18px 40px -8px rgba(0,0,10,.55);
      --g-shadow-sm:0 8px 18px -6px rgba(0,0,10,.6);
      --seg-on:rgba(190,210,255,.22);
      --on-accent:#08102A;
    }
    html[data-theme="wa"]{
      --amb-base:#EBE1CF;
      --blob-a:rgba(196,72,60,.30);
      --blob-b:rgba(70,92,140,.26);
      --blob-c:rgba(140,166,110,.30);
      --amb-texture:repeating-linear-gradient(90deg, rgba(120,90,60,.025) 0 1px, transparent 1px 7px);
      --g-fill:rgba(255,250,240,.52);
      --g-fill-hi:rgba(255,251,243,.76);
      --g-well:rgba(255,252,246,.50);
      --g-sheen:rgba(255,255,255,.55);
      --g-shadow:0 1px 1px rgba(70,50,30,.05), 0 14px 32px -8px rgba(80,50,30,.16);
      --g-shadow-sm:0 6px 14px -5px rgba(80,50,30,.18);
      --g-hair:rgba(42,36,30,.08);
    }
    html[data-theme="cn"]{
      --amb-base:#EED9AE;
      --blob-a:rgba(210,40,30,.34);
      --blob-b:rgba(240,180,60,.50);
      --blob-c:rgba(150,30,40,.22);
      --g-fill:rgba(255,246,222,.50);
      --g-fill-hi:rgba(255,248,228,.76);
      --g-well:rgba(255,250,232,.48);
      --g-sheen:rgba(255,248,220,.6);
      --g-rim:rgba(255,236,180,.95);
      --g-rim-low:rgba(200,150,50,.30);
      --g-edge:rgba(230,190,110,.55);
      --g-hair:rgba(160,110,30,.14);
      --g-shadow:0 1px 1px rgba(90,40,10,.05), 0 14px 32px -8px rgba(120,50,10,.20);
      --g-shadow-sm:0 6px 14px -5px rgba(120,50,10,.22);
    }
    html[data-theme="pixel"]{
      --amb-base:#150F22;
      --blob-a:rgba(255,77,141,.42);
      --blob-b:rgba(110,80,255,.40);
      --blob-c:rgba(60,220,200,.24);
      --amb-texture:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      --g-blur:14px;
      --g-fill:rgba(42,33,64,.55);
      --g-fill-hi:rgba(50,40,76,.82);
      --g-well:rgba(12,8,22,.45);
      --g-sheen:rgba(255,255,255,.10);
      --g-rim:rgba(255,255,255,.40);
      --g-rim-low:rgba(255,255,255,.08);
      --g-edge:rgba(255,255,255,.16);
      --g-hair:rgba(255,255,255,.10);
      --g-shadow:4px 4px 0 #000;
      --g-shadow-sm:3px 3px 0 #000;
      --seg-on:rgba(255,255,255,.20);
      --accent-glow:#000;
      --cap-r:0px;
    }
    html[data-theme="scifi"]{
      --amb-base:#03060C;
      --blob-a:rgba(0,229,255,.26);
      --blob-b:rgba(0,120,255,.28);
      --blob-c:rgba(120,255,210,.12);
      --amb-texture:
        linear-gradient(rgba(0,229,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.045) 1px, transparent 1px);
      --g-fill:rgba(8,20,34,.48);
      --g-fill-hi:rgba(10,28,46,.76);
      --g-well:rgba(0,8,16,.42);
      --g-sheen:rgba(120,240,255,.10);
      --g-rim:rgba(120,240,255,.55);
      --g-rim-low:rgba(0,229,255,.12);
      --g-edge:rgba(0,229,255,.22);
      --g-hair:rgba(0,229,255,.12);
      --g-shadow:0 0 0 1px rgba(0,229,255,.05), 0 16px 40px -10px rgba(0,229,255,.18);
      --g-shadow-sm:0 6px 16px -6px rgba(0,229,255,.25);
      --seg-on:rgba(0,229,255,.16);
      --on-accent:#00151B;
    }
    html[data-theme="oled"]{
      /* stays almost entirely black: two faint glows give the glass something to bend */
      --amb-base:#000;
      --blob-a:rgba(255,106,58,.16);
      --blob-b:rgba(120,90,255,.12);
      --blob-c:rgba(255,255,255,.04);
      --g-fill:rgba(255,255,255,.035);
      --g-fill-hi:rgba(22,22,22,.80);
      --g-well:rgba(255,255,255,.04);
      --g-sheen:rgba(255,255,255,.07);
      --g-rim:rgba(255,255,255,.30);
      --g-rim-low:rgba(255,255,255,.07);
      --g-edge:rgba(255,255,255,.11);
      --g-hair:rgba(255,255,255,.08);
      --g-shadow:0 20px 40px -12px rgba(0,0,0,.9);
      --g-shadow-sm:0 6px 14px -6px rgba(0,0,0,.9);
      --seg-on:rgba(255,255,255,.14);
    }
    
    /* ---------- ambient light layer ---------- */
    html[data-theme] body{ background:transparent; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
    html{ background:var(--amb-base); }
    .lg-ambient{
      position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden;
      background:var(--amb-texture), var(--amb-base);
      background-size:auto;
    }
    html[data-theme="pixel"] .lg-ambient,
    html[data-theme="scifi"] .lg-ambient{ background-size:24px 24px, 24px 24px, auto; }
    .lg-ambient i{
      position:absolute; width:70vmax; height:70vmax; border-radius:50%;
      will-change:transform;
      animation:lg-drift 34s ease-in-out infinite alternate;
    }
    .lg-ambient i:nth-child(1){ left:-24vmax; top:-30vmax; background:radial-gradient(circle, var(--blob-a), transparent 64%); }
    .lg-ambient i:nth-child(2){ right:-28vmax; top:8vh; background:radial-gradient(circle, var(--blob-b), transparent 64%); animation-duration:41s; animation-delay:-12s; }
    .lg-ambient i:nth-child(3){ left:4vmax; bottom:-40vmax; background:radial-gradient(circle, var(--blob-c), transparent 64%); animation-duration:47s; animation-delay:-20s; }
    /* pixel: stepped, banded light instead of smooth falloff */
    html[data-theme="pixel"] .lg-ambient i:nth-child(1){ background:radial-gradient(circle, var(--blob-a) 0 22%, color-mix(in srgb,var(--blob-a) 55%,transparent) 22% 40%, color-mix(in srgb,var(--blob-a) 22%,transparent) 40% 58%, transparent 58%); }
    html[data-theme="pixel"] .lg-ambient i:nth-child(2){ background:radial-gradient(circle, var(--blob-b) 0 22%, color-mix(in srgb,var(--blob-b) 55%,transparent) 22% 40%, color-mix(in srgb,var(--blob-b) 22%,transparent) 40% 58%, transparent 58%); }
    html[data-theme="pixel"] .lg-ambient i:nth-child(3){ background:radial-gradient(circle, var(--blob-c) 0 22%, color-mix(in srgb,var(--blob-c) 55%,transparent) 22% 40%, transparent 40%); }
    @keyframes lg-drift{
      0%{ transform:translate3d(0,0,0) scale(1); }
      50%{ transform:translate3d(6vmax,4vmax,0) scale(1.08); }
      100%{ transform:translate3d(-4vmax,7vmax,0) scale(.96); }
    }
    /* the light stays still on phones (re-blurring a moving backdrop costs battery) */
    @media (max-width:859px){ .lg-ambient i{ animation:none; } }
    body.page-scrolling .lg-ambient i{ animation-play-state:paused; }
    @media (prefers-reduced-motion:reduce){ .lg-ambient i{ animation:none; } }

    /* ==========================================================================
       食譜工具：元件
       全部使用上面的主題變數與玻璃配方（與「拍立得小房間」同一套），
       所以切換主題時，兩個頁面的質感與配色會一致。
       ========================================================================== */
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --danger:#C8432B;
      --dim:var(--muted);
      --glass-rim:inset 0 1px 0 var(--g-rim), inset 0 0 0 1px var(--g-edge), inset 0 -1px 0 var(--g-rim-low);
      --card-r:22px;
    }
    html[data-theme="space"], html[data-theme="pixel"], html[data-theme="scifi"], html[data-theme="oled"] { --danger:#FF8F7E; }
    html[data-theme="pixel"] { --card-r:0px; }

    html, body { margin:0; color:var(--ink); }
    html { background:var(--amb-base); }
    body {
      min-height:100dvh; background:transparent;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    }
    button, input, select, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    img { max-width:100%; display:block; }
    option { background:var(--card); color:var(--ink); }

    .app { position:relative; z-index:1; max-width:740px; margin:0 auto; padding-bottom:calc(96px + var(--safe-b)); }

    /* ---------- header: a floating glass capsule ---------- */
    header.top {
      position:sticky; top:0; z-index:30; min-height:58px;
      padding:calc(10px + var(--safe-t)) 16px 10px;
      display:flex; align-items:center; gap:8px;
      background:linear-gradient(180deg, color-mix(in srgb, var(--amb-base) 78%, transparent) 0%, color-mix(in srgb, var(--amb-base) 40%, transparent) 70%, transparent 100%);
    }
    @media (min-width:760px) { header.top { background:none; } }
    header.top::before {
      content:""; position:absolute; z-index:-1;
      top:calc(6px + var(--safe-t)); bottom:6px; left:4px; right:4px;
      border-radius:var(--cap-r);
      background:linear-gradient(180deg, var(--g-sheen), transparent 70%), var(--g-fill-hi);
      -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      box-shadow:var(--glass-rim), var(--g-shadow);
    }
    .brand { flex:1; min-width:0; display:flex; align-items:center; gap:10px; }
    .brand > div { min-width:0; }
    .mark {
      width:30px; height:30px; border-radius:50%; flex:0 0 auto; position:relative;
      background:radial-gradient(circle at 35% 28%, color-mix(in srgb, var(--fuji) 62%, #fff), var(--fuji) 62%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 0 0 3px var(--g-well), 0 6px 14px -4px var(--accent-glow);
    }
    .mark::after { content:""; position:absolute; inset:8px; border-radius:50%; border:2px solid rgba(255,255,255,.55); }
    html[data-theme="pixel"] .mark, html[data-theme="pixel"] .mark::after { border-radius:0; }
    .brand h1 { margin:0; font-family:"Noto Serif TC","Noto Serif JP",serif; font-size:17px; letter-spacing:.12em; font-weight:700; white-space:nowrap; }
    .brand p { margin:2px 0 0; color:var(--muted); font-size:11px; letter-spacing:.08em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* round glass chips in the header */
    .icon-btn {
      position:relative; flex:none; width:40px; height:40px; border:0; border-radius:50%;
      color:var(--ink); display:grid; place-items:center; font-size:16px; text-decoration:none;
      background:var(--g-well);
      box-shadow:inset 0 1px 0 var(--g-rim-low), inset 0 0 0 1px var(--g-hair), 0 1px 2px rgba(0,0,0,.06);
      transition:transform .35s var(--spring);
    }
    .icon-btn:active { transform:scale(.9); }
    .icon-btn svg { display:block; }
    html[data-theme="pixel"] .icon-btn { border-radius:0; }
    .theme-btn select {
      position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
      appearance:none; -webkit-appearance:none; border:0; border-radius:inherit; font-size:16px;
    }
    .theme-btn:focus-within { box-shadow:inset 0 0 0 1.5px var(--fuji), 0 0 0 4px var(--fuji-dim); }

    /* ---------- buttons ---------- */
    .pbtn {
      border:0; min-height:42px; padding:0 16px; border-radius:999px;
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      color:var(--ink); font-weight:700; font-size:13px; text-decoration:none; white-space:nowrap;
      background:linear-gradient(180deg, var(--g-sheen), transparent 80%), var(--g-fill-hi);
      box-shadow:var(--glass-rim), var(--g-shadow-sm);
      transition:transform .4s var(--spring), box-shadow .2s ease, opacity .15s;
    }
    .pbtn:active { transform:scale(.94); }
    .pbtn:disabled { opacity:.4; }
    .pbtn.full { width:100%; }
    .pbtn.ghost { background:linear-gradient(180deg, var(--g-sheen), transparent 80%), var(--g-well); }
    .pbtn.red {

      background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 52%), var(--fuji);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.14),

        0 10px 24px -8px var(--accent-glow);
    }
    html[data-theme="pixel"] .pbtn { border-radius:0; box-shadow:inset 0 0 0 1px var(--g-edge), 3px 3px 0 #000; }
    html[data-theme="pixel"] .pbtn.red { box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 4px 4px 0 #000; }

    /* buttons sitting on the glass capsule read as recessed chips, like the round icon buttons */
    header.top .pbtn:not(.red) {
      background:var(--g-well);
      box-shadow:inset 0 1px 0 var(--g-rim-low), inset 0 0 0 1px var(--g-hair), 0 1px 2px rgba(0,0,0,.06);
    }
    html[data-theme="pixel"] header.top .pbtn:not(.red) { box-shadow:inset 0 0 0 1px var(--g-edge), 2px 2px 0 #000; }
    .studio-link { min-height:40px; padding:0 14px; font-size:13px; }
    .studio-link.in-wrap { display:none; width:100%; margin-top:10px; }
    @media (max-width:559px) {
      header.top .studio-link { display:none; }
      .studio-link.in-wrap { display:inline-flex; }
    }

    .wrap { padding:16px; }

    /* ---------- search + toolbar ---------- */
    .search {
      width:100%; border:0; min-height:46px; padding:0 18px; border-radius:999px; outline:none;
      background:var(--g-well); color:var(--ink);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.06), inset 0 0 0 1px var(--g-hair);
    }
    .search::placeholder { color:var(--muted); }
    .search:focus { box-shadow:inset 0 0 0 1px var(--fuji), 0 0 0 4px var(--fuji-dim); }
    html[data-theme="pixel"] .search { border-radius:0; }
    .toolbar { display:flex; gap:8px; margin-top:12px; }
    .toolbar .pbtn { flex:1; }

    /* ---------- recipe cards ---------- */
    .grid { display:grid; gap:14px; margin-top:16px; }
    @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr; } }
    .card {
      position:relative; display:block; width:100%; text-align:left; border:0; padding:0; overflow:hidden;
      color:var(--ink); border-radius:var(--card-r);
      background:linear-gradient(180deg, var(--g-sheen) 0, transparent 80px), var(--g-fill-hi);
      box-shadow:var(--glass-rim), var(--g-shadow);
      animation:rise .45s ease backwards;
      transition:transform .4s var(--spring);
    }
    /* blur only where it is cheap: dozens of blurred cards would make phones scroll badly */
    @media (min-width:700px) and (hover:hover) {
      .card {
        background:linear-gradient(180deg, var(--g-sheen) 0, transparent 80px), var(--g-fill);
        -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
        backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      }
      .card:hover { transform:translateY(-3px); }
    }
    .card:active { transform:scale(.98); }
    .card::before {
      content:""; position:absolute; z-index:2; left:0; top:16px; bottom:16px; width:4px;
      border-radius:0 4px 4px 0; background:var(--accent, var(--fuji));
      box-shadow:0 0 12px var(--accent, var(--fuji));
    }
    .cover {
      position:relative; aspect-ratio:3/2;
      background:radial-gradient(120% 90% at 28% 18%, color-mix(in srgb, var(--accent, var(--fuji)) 55%, transparent), transparent 72%), var(--g-well);
    }
    .cover img { width:100%; height:100%; object-fit:cover; }
    .cover::after { content:""; position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 -1px 0 var(--g-hair); }
    .cover.nophoto { aspect-ratio:12/5; }
    .tag {
      position:absolute; left:14px; bottom:10px; z-index:1;
      background:rgba(12,12,14,.55); color:#fff; font-size:11px; letter-spacing:.04em;
      padding:4px 10px; border-radius:999px;
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
    }
    html[data-theme="pixel"] .tag { border-radius:0; }
    .card-body { padding:12px 16px 16px 18px; }
    .card-body h3 { margin:0 0 6px; font-family:"Noto Serif TC","Noto Serif JP",serif; font-size:18px; font-weight:700; letter-spacing:.02em; }
    .meta { color:var(--muted); font-size:12px; }
    .meters { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
    .meter span { display:block; font-size:10px; color:var(--muted); letter-spacing:.08em; }
    .bar { height:5px; background:color-mix(in srgb, var(--ink) 14%, transparent); border-radius:99px; overflow:hidden; margin-top:4px; }
    .bar i { display:block; height:100%; width:var(--w,50%); border-radius:inherit; background:linear-gradient(90deg, color-mix(in srgb, var(--fuji) 70%, #fff), var(--fuji)); }
    html[data-theme="pixel"] .bar, html[data-theme="pixel"] .bar i { border-radius:0; }

    .empty { text-align:center; padding:48px 12px; color:var(--muted); grid-column:1 / -1; }
    .empty h2 { color:var(--ink); font-family:"Noto Serif TC","Noto Serif JP",serif; letter-spacing:.2em; }

    .fab {
      position:fixed; right:18px; bottom:calc(18px + var(--safe-b)); z-index:40;
      width:60px; height:60px; border-radius:50%; border:0; font-size:28px; font-weight:700; line-height:1;
      color:var(--on-accent);
      background:linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,0) 52%), var(--fuji);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.14),
        inset 0 0 0 1px color-mix(in srgb, var(--fuji) 70%, #fff),
        0 14px 28px -8px var(--accent-glow);
      transition:transform .4s var(--spring);
    }
    .fab:active { transform:scale(.9); }
    html[data-theme="pixel"] .fab { border-radius:0; box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 4px 4px 0 #000; }

    /* ---------- screens ---------- */
    .screen { display:none; }
    .screen.show { display:block; animation:rise .38s ease backwards; }

    /* ---------- detail ---------- */
    .hero {
      position:relative; overflow:hidden; margin:4px 16px 0; height:min(64vw,380px); border-radius:calc(var(--card-r) + 4px);
      background:radial-gradient(120% 90% at 28% 18%, color-mix(in srgb, var(--fuji) 50%, transparent), transparent 72%), var(--g-well);
      box-shadow:var(--glass-rim), var(--g-shadow);
    }
    .hero img { width:100%; height:100%; object-fit:cover; animation:ken .9s ease; }
    .kv, .notes {
      color:var(--ink); border-radius:var(--card-r); overflow:hidden;
      background:linear-gradient(180deg, var(--g-sheen) 0, transparent 72px), var(--g-fill);
      -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      box-shadow:var(--glass-rim), var(--g-shadow);
    }
    .kv-row { display:flex; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--g-hair); font-size:14px; }
    .kv-row:last-child { border-bottom:0; }
    .kv-row span { color:var(--muted); }
    .kv-row b { text-align:right; font-weight:650; }
    .notes { margin-top:14px; padding:14px 16px; white-space:pre-wrap; }
    .photos { display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px; }
    .photos img { width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:var(--r-lg); box-shadow:var(--g-shadow-sm); }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
    #detail h2 { font-family:"Noto Serif TC","Noto Serif JP",serif; letter-spacing:.02em; }

    /* ---------- form ---------- */
    .form { display:grid; gap:12px; }
    #form {
      padding:16px; border-radius:calc(var(--card-r) + 4px);
      background:linear-gradient(180deg, var(--g-sheen) 0, transparent 90px), var(--g-fill);
      -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      box-shadow:var(--glass-rim), var(--g-shadow);
    }
    label.field { display:grid; gap:6px; font-size:12px; color:var(--muted); }
    .field input, .field select, .field textarea {
      width:100%; border:0; border-radius:12px; padding:11px 12px; outline:none;
      background-color:var(--g-well); color:var(--ink);
      box-shadow:inset 0 1px 2px rgba(0,0,0,.06), inset 0 0 0 1px var(--g-hair);
    }
    .field input:focus, .field select:focus, .field textarea:focus { box-shadow:inset 0 0 0 1px var(--fuji), 0 0 0 4px var(--fuji-dim); }
    .field select {
      appearance:none; -webkit-appearance:none; padding-right:30px;
      background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(100% - 16px) 50%, calc(100% - 11px) 50%;
      background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
    }
    .field textarea { min-height:92px; }
    .wrap > label.field + label.field { margin-top:12px; }
    html[data-theme="pixel"] .field input, html[data-theme="pixel"] .field select, html[data-theme="pixel"] .field textarea { border-radius:0; }
    .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
    .thumbs { display:flex; gap:8px; flex-wrap:wrap; }
    .thumb { position:relative; width:84px; height:84px; border-radius:12px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--g-hair), 0 4px 10px -4px rgba(0,0,0,.25); }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .thumb button { position:absolute; top:4px; right:4px; width:22px; height:22px; border:0; border-radius:50%; background:var(--fuji); color:var(--on-accent); box-shadow:0 0 0 2px var(--amb-base); }
    .addph { width:84px; height:84px; border-radius:12px; border:1px dashed var(--g-edge); background:var(--g-well); display:grid; place-items:center; color:var(--muted); font-size:12px; }
    html[data-theme="pixel"] .thumb, html[data-theme="pixel"] .addph, html[data-theme="pixel"] .thumb button { border-radius:0; }

    /* ---------- camera screen ---------- */
    .warn {
      padding:12px 16px; border-radius:var(--r-lg); font-size:12px; line-height:1.6; color:var(--ink);
      background:linear-gradient(180deg, var(--g-sheen), transparent 70%), color-mix(in srgb, var(--danger) 16%, var(--g-fill-hi));
      box-shadow:var(--glass-rim), var(--g-shadow-sm);
    }
    .okbox {
      padding:12px 16px; border-radius:var(--r-lg); font-size:13px;
      background:var(--g-well); box-shadow:inset 0 0 0 1px var(--g-hair), inset 0 1px 0 var(--g-rim-low);
    }
    .log {
      margin-top:12px; padding:12px; border-radius:var(--r-md); min-height:80px;
      background:var(--g-well); color:var(--ink); box-shadow:inset 0 1px 3px rgba(0,0,0,.12), inset 0 0 0 1px var(--g-hair);
      font-size:11px; white-space:pre-wrap; font-family:ui-monospace,monospace;
    }
    .cam-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); display:inline-block; }
    .cam-dot.on { background:#3dcc6f; box-shadow:0 0 8px #3dcc6f; }

    /* ---------- toast, shutter, login sheet ---------- */
    .toast {
      position:fixed; left:50%; bottom:calc(92px + var(--safe-b));
      transform:translateX(-50%) translateY(8px);
      padding:10px 16px; border-radius:999px; font-size:13px; color:var(--ink);
      background:linear-gradient(180deg, var(--g-sheen), transparent 70%), var(--g-fill-hi);
      -webkit-backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      backdrop-filter:blur(var(--g-blur)) saturate(var(--g-sat));
      box-shadow:var(--glass-rim), var(--g-shadow);
      opacity:0; pointer-events:none; z-index:90; transition:.25s;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    html[data-theme="pixel"] .toast { border-radius:0; }
    .hidden { display:none; }
    .shutter { position:fixed; inset:0; background:#fff; z-index:100; pointer-events:none; opacity:0; }
    .shutter.go { animation:shutter .42s ease; }
    @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
    @keyframes ken { from { transform:scale(1.06); } to { transform:none; } }
    @keyframes shutter { 0% { opacity:0 } 18% { opacity:1 } 100% { opacity:0 } }

    .gate {
      position:fixed; inset:0; z-index:80; display:none; place-items:center; padding:24px;
      background:color-mix(in srgb, var(--amb-base) 50%, transparent);
      -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    }
    .gate.show { display:grid; }
    .gate-card {
      width:min(92vw,360px); padding:22px 18px; border-radius:calc(var(--card-r) + 4px);
      background:linear-gradient(180deg, var(--g-sheen), transparent 90px), var(--g-fill-hi);
      -webkit-backdrop-filter:blur(30px) saturate(1.8); backdrop-filter:blur(30px) saturate(1.8);
      box-shadow:var(--glass-rim), 0 24px 60px -12px rgba(0,0,0,.45);
    }
    .gate-card h2 { margin:0 0 12px; font-family:"Noto Serif TC","Noto Serif JP",serif; font-size:18px; letter-spacing:.12em; }
    .gate-card p { color:var(--muted); font-size:12px; line-height:1.6; margin:0 0 14px; }
    #login-err { color:var(--danger); min-height:1.2em; margin:8px 0; }
    #login-err.ok { color:var(--muted); }

    .footer-tools { margin-top:32px; padding:24px 16px; text-align:center; border-top:1px dashed var(--g-edge); }
    .footer-tools p { font-size:11px; color:var(--muted); margin:0 0 12px; }

    /* narrow phones: keep the capsule on one row */
    @media (max-width:380px) {
      header.top { gap:6px; padding-inline:12px; }
      .brand h1 { font-size:15px; letter-spacing:.06em; }
      .mark { width:26px; height:26px; }
      .mark::after { inset:6px; }
      .icon-btn { width:36px; height:36px; }
    }
    @media (max-width:340px) { .mark { display:none; } }

    /* browsers without backdrop-filter: make the glass opaque enough to read */
    @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
      header.top::before, .card, .kv, .notes, #form, .toast, .gate-card { background-color:var(--card); }
    }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="lg-ambient" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="shutter" id="shutter"></div>
  <div class="gate" id="gate">
    <form class="gate-card" id="login-form">
      <h2>共用食譜</h2>
      <label class="field">Email<input id="login-email" type="email" required autocomplete="username"></label>
      <p id="login-err" class="hint"></p>
      <button class="pbtn red full" type="submit">寄出</button>
    </form>
  </div>
  <div class="app">
    <section id="list-screen" class="screen show">
      <header class="top">
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <h1>富士食譜工具</h1>
          </div>
        </div>
        <a class="pbtn ghost studio-link" href="polaroid.html" title="拍立得小房間" aria-label="拍立得小房間">拍立得小房間</a>
        <label class="icon-btn theme-btn" title="介面主題">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4-4-7.9-9-7.9z"/>
            <circle cx="7.5" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="10.5" cy="7.2" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="7.2" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <select id="theme-select" aria-label="介面主題">
            <option value="desk">工作桌</option>
            <option value="space">太空</option>
            <option value="wa">日式</option>
            <option value="cn">中式</option>
            <option value="pixel">像素</option>
            <option value="scifi">科幻</option>
            <option value="oled">OLED 全黑</option>
          </select>
        </label>
        <button class="icon-btn" id="btn-auth" title="登入共用" aria-label="登入共用">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.4"/><path d="M5 20c.8-3.8 3.5-5.6 7-5.6s6.2 1.8 7 5.6"/>
          </svg>

          </svg>
        </button>
      </header>
      <div class="wrap">
        <input class="search" id="q" placeholder="搜尋食譜名稱、軟片模擬…" />
        <div class="toolbar">
          <button class="pbtn ghost" id="btn-export">匯出設定</button>
          <button class="pbtn ghost" id="btn-import">匯入設定</button>
        </div>
        <a class="pbtn ghost studio-link in-wrap" href="polaroid.html">拍立得小房間 ›</a>

        <!-- 頁尾清除快取區域 -->

        </div>
      </div>
    </section>

    <section id="detail-screen" class="screen">
      <header class="top">
        <button class="pbtn ghost" id="back-list">返回</button>
        <div class="brand"><div><h1 id="d-title">食譜</h1><p id="d-sub"></p></div></div>
        <button class="pbtn" id="btn-edit">編輯</button>
      </header>
      <div id="detail"></div>

    <section id="edit-screen" class="screen">
      <header class="top">
        <button class="pbtn ghost" id="back-edit">返回</button>

  <input class="hidden" id="import-file" type="file" accept="application/json,.json" />

<script>
const FILM = [
  ["PROVIA / Standard", 0x01],["Velvia / Vivid", 0x02],["ASTIA / Soft", 0x03],
  ["PRO Neg. Hi", 0x04],["PRO Neg. Std", 0x05],
  ["Monochrome", 0x06],["Monochrome+Ye", 0x07],["Monochrome+R", 0x08],["Monochrome+G", 0x09],

async function cloudUpsert(recipe){
  if(!cloudUser || !recipe || recipe.id==="demo-gold") return;
  const payload = {
    title: recipe.name || "",
    data: recipe,
    updated_at: new Date().toISOString(),
    updated_by: cloudUser.email || ""
  };
  const { data: rows, error: qerr } = await sb.from("recipes").select("id").filter("data->>id","eq", String(recipe.id)).limit(1);
  if(qerr){ toast("雲端讀取失敗"); console.warn(qerr); return; }
  if(rows && rows.length){
    const { error } = await sb.from("recipes").update(payload).eq("id", rows[0].id);
    if(error) toast("雲端更新失敗");
  }else{
    const { error } = await sb.from("recipes").insert(payload);
    if(error) toast("雲端新增失敗");
  }
  let ok=0, fail=0;
  for(const pid of (recipe.photos||[])){
    if(await uploadPhoto(recipe.id, pid)) ok++; else if(pid) fail++;
  }
  if((recipe.photos||[]).length && fail) toast("有 "+fail+" 張照片沒傳到雲端");
}
async function cloudDelete(recipe){
  if(!cloudUser || !recipe) return;

  if(rows && rows.length) await sb.from("recipes").delete().eq("id", rows[0].id);
  const paths = (recipe.photos||[]).map(pid => photoPath(recipe.id, pid));
  if(paths.length) await sb.storage.from("photos").remove(paths);
}
async function cloudPull(){
  const { data, error } = await sb.from("recipes").select("data").order("updated_at", { ascending:false });
  if(error){ toast("同步失敗："+error.message); return false; }
  const remote = (data||[]).map(x => migrateRecipe(x.data||x)).filter(r => r && r.id && r.id!=="demo-gold");
  if(!remote.length){
    const locals = state.recipes.filter(r => r.id!=="demo-gold");
    for(const r of locals) await cloudUpsert(r);
    toast(locals.length ? "已把本機食譜上傳到雲端" : "雲端還是空的，可以新增");
    return true;
  }
  state.recipes = remote;
  save();
  let missing=0;
  for(const r of state.recipes){
    for(const pid of (r.photos||[])){

  return true;
}

function compressImage(file, max=1200, q=0.72){
  return new Promise((resolve,reject)=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b?resolve(b):reject(); }, "image/jpeg", q);
    };
    img.onerror = error=>{URL.revokeObjectURL(url);reject(error);}; img.src = url;
  });
}

/* ===== PTP / WebUSB ===== */
const OP = { GetDeviceInfo:0x1001, OpenSession:0x1002, CloseSession:0x1003, GetProp:0x1015, SetProp:0x1016 };
const OK = 0x2001;
function u16(n){ const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n&0xffff,true); return b; }
function i16(n){ const b=new Uint8Array(2); new DataView(b.buffer).setInt16(0,n,true); return b; }
function ptpStr(s){
  const chars = Array.from(s); const n = chars.length+1;
  const buf = new Uint8Array(1+n*2); buf[0]=n;
  const v = new DataView(buf.buffer);
  chars.forEach((ch,i)=>v.setUint16(1+i*2, ch.codePointAt(0), true));
  return buf;
}
function copyUsb(dv){
  if(!dv || !dv.byteLength) return new Uint8Array(0);
  return new Uint8Array(dv.buffer.slice(dv.byteOffset, dv.byteOffset + dv.byteLength));
}
function parsePtpStr(data){
  if(!data || data.length < 1) return "";
  const n = data[0];
  const v = new DataView(data.buffer, data.byteOffset, data.byteLength);
  let out = "";
  for(let i=0;i<Math.max(0,n-1);i++){
    const off = 1 + i*2;
    if(off + 1 >= data.length) break;
    const c = v.getUint16(off,true);
    if(!c) break;
    out += String.fromCodePoint(c);
  }
  return out;
}
function concat(a,b){ const o=new Uint8Array(a.length+b.length); o.set(a,0); o.set(b,a.length); return o; }

class PtpCam {
  constructor(device){ this.device=device; this.tid=0; this.epIn=null; this.epOut=null; }
  async open(){
    await this.device.open();
    if(this.device.configuration==null) await this.device.selectConfiguration(1);
    const ifaces = this.device.configuration.interfaces;
    let iface = 0, alt = ifaces[0].alternates[0];
    for(const inf of ifaces){
      for(const a of inf.alternates){
        const bulk = a.endpoints.filter(e=>e.type==="bulk");
        if(bulk.some(e=>e.direction==="in") && bulk.some(e=>e.direction==="out")){
          iface = inf.interfaceNumber; alt = a;
        }
      }
    }
    await this.device.claimInterface(iface);
    try { if(alt.alternateSetting) await this.device.selectAlternateInterface(iface, alt.alternateSetting); } catch {}
    this.iface = iface;
    const claimed = this.device.configuration.interfaces.find(i=>i.interfaceNumber===iface);
    const eps = (claimed.alternates.find(a=>a.alternateSetting===alt.alternateSetting) || claimed.alternates[0] || alt).endpoints;
    this.epIn = eps.find(e=>e.type==="bulk"&&e.direction==="in").endpointNumber;
    this.epOut = eps.find(e=>e.type==="bulk"&&e.direction==="out").endpointNumber;
    this.pkt = Math.max(64, (eps.find(e=>e.type==="bulk"&&e.direction==="in").packetSize) || 512);
  }
  async close(){
    try { await this.cmd(OP.CloseSession); } catch {}
    try { await this.device.releaseInterface(this.iface); } catch {}
    try { await this.device.close(); } catch {}
  }
  pack(type, code, tid, params=[], payload=new Uint8Array()){
    const len = 12 + params.length*4 + payload.length;
    const buf = new Uint8Array(len);
    const v = new DataView(buf.buffer);
    v.setUint32(0,len,true); v.setUint16(4,type,true); v.setUint16(6,code,true); v.setUint32(8,tid,true);
    params.forEach((p,i)=>v.setUint32(12+i*4,p>>>0,true));
    if(payload.length) buf.set(payload, 12+params.length*4);
    return buf;
  }
  async transferOut(bytes){
    const chunk = 512;
    for(let i=0;i<bytes.length;i+=chunk){
      await this.device.transferOut(this.epOut, bytes.slice(i, i+chunk));
    }
  }
  async readSome(){
    const res = await this.device.transferIn(this.epIn, this.pkt || 512);
    if(res.status === "stall"){
      try { await this.device.clearHalt("in", this.epIn); } catch {}
      return new Uint8Array(0);
    }
    return copyUsb(res.data);
  }
  async readContainer(){
    let acc = new Uint8Array(0);
    const t0 = Date.now();
    while(acc.length < 12){
      if(Date.now()-t0 > 8000) throw new Error("讀取 PTP 標頭逾時");
      acc = concat(acc, await this.readSome());
    }
    const total = new DataView(acc.buffer).getUint32(0,true);
    if(total < 12 || total > 1024*1024) throw new Error("PTP 長度異常 "+total);
    while(acc.length < total){
      if(Date.now()-t0 > 12000) throw new Error("讀取 PTP 資料逾時");
      acc = concat(acc, await this.readSome());
    }
    const v = new DataView(acc.buffer, 0, acc.byteLength);
    return {
      length: total,
      type: v.getUint16(4,true),
      code: v.getUint16(6,true),
      tid: v.getUint32(8,true),
      payload: acc.slice(12, total)
    };
  }
  async cmd(opcode, params=[], dataOut=null){
    const tid = ++this.tid;
    await this.transferOut(this.pack(1, opcode, tid, params));
    if(dataOut) await this.transferOut(this.pack(2, opcode, tid, [], dataOut));
    let data = new Uint8Array(0), code = 0;
    for(let i=0;i<8;i++){
      const pkt = await this.readContainer();
      if(pkt.type===2) data = pkt.payload;
      if(pkt.type===3){ code = pkt.code; break; }
    }
    return { code, data };
  }
  async getDeviceInfo(){
    const fallback = {
      manufacturer: this.device.manufacturerName || "FUJIFILM",
      model: this.device.productName || "Fujifilm",
      version: "",
      serial: this.device.serialNumber || ""
    };
    try{
      const {code,data} = await this.cmd(OP.GetDeviceInfo);
      if(code!==OK || !data.length) return fallback;
      const r = new Reader(data);
      r.u16(); r.u32(); r.u16(); r.str(); r.u16();
      r.u16arr(); r.u16arr(); r.u16arr(); r.u16arr(); r.u16arr();
      const manufacturer=r.str()||fallback.manufacturer;
      const model=r.str()||fallback.model;
      const version=r.str()||fallback.version;
      const serial=r.str()||fallback.serial;
      return { manufacturer, model, version, serial };
    }catch{
      return fallback;
    }
  }
  async getProp(id){
    const {code,data} = await this.cmd(OP.GetProp, [id]);
    if(code!==OK) return null;
    return data;
  }
  async getU16(id){
    const d = await this.getProp(id);
    if(!d || d.length<2) return null;
    return new DataView(d.buffer, d.byteOffset, d.byteLength).getUint16(0,true);
  }
  async getI16(id){
    const d = await this.getProp(id);
    if(!d || d.length<2) return null;
    return new DataView(d.buffer, d.byteOffset, d.byteLength).getInt16(0,true);
  }
  async setU16(id, val){ return (await this.cmd(OP.SetProp,[id], u16(val))).code===OK; }
  async setI16(id, val){ return (await this.cmd(OP.SetProp,[id], i16(val))).code===OK; }
  async setStr(id, val){ return (await this.cmd(OP.SetProp,[id], ptpStr(val))).code===OK; }
}

class Reader {
  constructor(u8){
    this.u8 = u8 instanceof Uint8Array ? new Uint8Array(u8) : new Uint8Array(u8 || []);
    this.v = new DataView(this.u8.buffer);
    this.o = 0;
  }
  left(){ return this.u8.length - this.o; }
  u16(){
    if(this.left() < 2) return 0;
    const x = this.v.getUint16(this.o,true); this.o += 2; return x;
  }
  u32(){
    if(this.left() < 4) return 0;
    const x = this.v.getUint32(this.o,true); this.o += 4; return x;
  }
  str(){
    if(this.left() < 1) return "";
    const n = this.u8[this.o]; this.o += 1;
    let s = "";
    for(let i=0;i<n;i++){
      if(this.left() < 2) break;
      const c = this.v.getUint16(this.o,true); this.o += 2;
      if(c) s += String.fromCodePoint(c);
    }
    return s;
  }
  u16arr(){
    const n = this.u16();
    const a = [];
    for(let i=0;i<n && this.left()>=2;i++) a.push(this.u16());
    return a;
  }
}

function pairVal(table, label){ const hit=table.find(x=>x[0]===label); return hit?hit[1]:null; }
function pairLabel(table, val){ const hit=table.find(x=>x[1]===val); return hit?hit[0]:null; }
function fmtTone(n){
  if(n==null || !Number.isFinite(n)) return "0";
  const v = Math.round(n)/10;
  if(Object.is(v,-0) || v===0) return "0";
  const s = Number.isInteger(v) ? String(v) : String(v);
  return (v>0?"+":"")+s;
}
const NR_DEC = {0x8000:-4,0x7000:-3,0x4000:-2,0x3000:-1,0x2000:0,0x1000:1,0x0000:2,0x6000:3,0x5000:4};
function tone10(s){ const n=parseFloat(String(s).replace("+","")); return Math.round((Number.isFinite(n)?n:0)*10); }
function shiftNum(s){ const n=parseInt(String(s).replace("+",""),10); return Number.isFinite(n)?n:0; }
const NR_ENC = {[-4]:0x8000,[-3]:0x7000,[-2]:0x4000,[-1]:0x3000,[0]:0x2000,[1]:0x1000,[2]:0x0000,[3]:0x6000,[4]:0x5000};

function logCam(s){ const el=$("#cam-log"); el.textContent += "\n"+s; el.scrollTop = el.scrollHeight; }

async function connectCam(){
  if(!navigator.usb){ toast("這支瀏覽器沒有 WebUSB，請用 Android Chrome"); return; }
  try{
    const device = await navigator.usb.requestDevice({ filters: [{ vendorId: FUJI_VID }] });
    const cam = new PtpCam(device);
    logCam("裝置：" + (device.productName || device.manufacturerName || "Fujifilm"));
    logCam("開啟 USB…");
    await cam.open();
    logCam("介面已占用，開始 PTP…");
    const sess = await cam.cmd(OP.OpenSession, [1]);
    if(sess.code !== OK && sess.code !== 0x201E){
      logCam("OpenSession 回應 " + sess.code.toString(16) + "，仍嘗試繼續");
    }
    const info = await cam.getDeviceInfo();
    logCam("型號：" + info.model + (info.version ? ("  FW " + info.version) : ""));
    state.cam = cam;
    $("#dot").classList.add("on");
    $("#cam-status").textContent = "已連線：" + info.model;
    $("#disconnect").disabled = $("#read-slots").disabled = $("#read-save").disabled = $("#write-slot").disabled = false;
    logCam("連線完成。");
    toast("相機已連線");
  }catch(err){
    logCam("失敗：" + (err.message||err));
    toast("連線失敗");
  }
}

async function disconnectCam(){
  if(state.cam){ await state.cam.close(); state.cam=null; }
  $("#dot").classList.remove("on");
  $("#cam-status").textContent = "尚未連線";
  $("#disconnect").disabled = $("#read-slots").disabled = $("#read-save").disabled = $("#write-slot").disabled = true;
  logCam("已中斷。");
}

async function readSlots(){
  if(!state.cam) return;
  logCam("讀取 C1–C7…");
  for(let slot=1; slot<=7; slot++){
    const ok = await state.cam.setU16(0xD18C, slot);
    if(!ok){ logCam("C"+slot+" 無法切換"); continue; }
    await new Promise(r=>setTimeout(r,80));
    const nameB = await state.cam.getProp(0xD18D);
    const fsB = await state.cam.getProp(0xD192);
    const name = nameB ? parsePtpStr(nameB) : "(無)";
    let fs = "?";
    if(fsB && fsB.length>=2){
      const v = new DataView(fsB.buffer, fsB.byteOffset, fsB.byteLength).getInt16(0,true);
      const hit = FILM.find(x=>x[1]===v); fs = hit?hit[0]:("0x"+v.toString(16));
    }
    logCam(`C${slot}  ${name}  /  ${fs}`);
  }
}

async function readSlotAsRecipe(slot){
  const cam = state.cam;
  if(!cam) throw new Error("未連線");
  logCam("切到 C"+slot+" 並讀取…");
  if(!await cam.setU16(0xD18C, slot)) throw new Error("無法選擇槽位");
  await new Promise(r=>setTimeout(r,150));
  const nameB = await cam.getProp(0xD18D);
  const slotName = (nameB ? parsePtpStr(nameB) : "").trim();
  const fs = await cam.getU16(0xD192);
  const dr = await cam.getU16(0xD190);
  const gr = await cam.getU16(0xD195);
  const cc = await cam.getU16(0xD196);
  const cb = await cam.getU16(0xD197);
  const wb = await cam.getU16(0xD199);
  const sr = await cam.getI16(0xD19A);
  const sb = await cam.getI16(0xD19B);
  const kk = await cam.getU16(0xD19C);
  const hi = await cam.getI16(0xD19D);
  const sh = await cam.getI16(0xD19E);
  const co = await cam.getI16(0xD19F);
  const sp = await cam.getI16(0xD1A0);
  const nr = await cam.getU16(0xD1A1);
  const cl = await cam.getI16(0xD1A2);
  const r = emptyRecipe();
  r.name = slotName || ("相機 C"+slot);
  r.notes = "從相機 C"+slot+" 讀取";
  r.filmSim = pairLabel(FILM, fs) || r.filmSim;
  r.dr = pairLabel(DRS, dr) || (dr===0 ? "自動" : r.dr);
  r.grain = pairLabel(GRAIN, gr) || r.grain;
  r.colorChrome = pairLabel(FX, cc) || r.colorChrome;
  r.colorChromeBlue = pairLabel(FX, cb) || r.colorChromeBlue;
  r.wb = pairLabel(WB, wb) || r.wb;
  if(kk) r.kelvin = String(kk);
  r.shiftR = sr==null ? "0" : ((sr>0?"+":"")+String(sr));
  r.shiftB = sb==null ? "0" : ((sb>0?"+":"")+String(sb));
  r.highlight = hi==null ? "0" : fmtTone(hi);
  r.shadow = sh==null ? "0" : fmtTone(sh);
  r.color = co==null ? "0" : fmtTone(co);
  r.sharpness = sp==null ? "0" : fmtTone(sp);
  r.clarity = cl==null ? "0" : fmtTone(cl);
  if(nr!=null && NR_DEC[nr]!=null) r.nr = String(NR_DEC[nr]);
  logCam("已讀 "+r.name+" / "+r.filmSim);
  state.recipes.unshift(r);
  save();
  return r;
}

async function writeRecipeToSlot(recipe, slot){
  const cam = state.cam;
  if(!cam) throw new Error("未連線");
  const name = (recipe.name||"RECIPE").slice(0,24);
  logCam("切到 C"+slot+" …");
  if(!await cam.setU16(0xD18C, slot)) throw new Error("無法選擇槽位");
  await new Promise(r=>setTimeout(r,120));
  logCam("寫入名稱…");
  if(!await cam.setStr(0xD18D, name)) logCam("名稱寫入被拒（可忽略）");

  const jobs = [];
  const fs = pairVal(FILM, recipe.filmSim);
  if(fs!=null) jobs.push(["FilmSim", 0xD192, ()=>cam.setU16(0xD192, fs)]);
  if(recipe.dr!=="自動" && recipe.dr!=="AUTO"){
    const dr = pairVal(DRS, recipe.dr);
    if(dr!=null) jobs.push(["DR", 0xD190, ()=>cam.setU16(0xD190, dr)]);
  }
  const gr = pairVal(GRAIN, recipe.grain);
  if(gr!=null) jobs.push(["Grain", 0xD195, ()=>cam.setU16(0xD195, gr)]);
  const cc = pairVal(FX, recipe.colorChrome);
  if(cc!=null) jobs.push(["Chrome", 0xD196, ()=>cam.setU16(0xD196, cc)]);
  const cb = pairVal(FX, recipe.colorChromeBlue);
  if(cb!=null) jobs.push(["FX Blue", 0xD197, ()=>cam.setU16(0xD197, cb)]);
  const wb = pairVal(WB, recipe.wb);
  if(wb!=null) jobs.push(["WB", 0xD199, ()=>cam.setU16(0xD199, wb)]);
  jobs.push(["ShiftR", 0xD19A, ()=>cam.setI16(0xD19A, shiftNum(recipe.shiftR))]);
  jobs.push(["ShiftB", 0xD19B, ()=>cam.setI16(0xD19B, shiftNum(recipe.shiftB))]);
  if(recipe.wb==="色溫" || recipe.wb==="Kelvin" && recipe.kelvin){
    jobs.push(["Kelvin", 0xD19C, ()=>cam.setU16(0xD19C, parseInt(recipe.kelvin,10)||5500)]);
  }
  jobs.push(["Highlight", 0xD19D, ()=>cam.setI16(0xD19D, tone10(recipe.highlight))]);
  jobs.push(["Shadow", 0xD19E, ()=>cam.setI16(0xD19E, tone10(recipe.shadow))]);
  if(!MONO.has(recipe.filmSim)){
    jobs.push(["Color", 0xD19F, ()=>cam.setI16(0xD19F, tone10(recipe.color))]);
  }
  jobs.push(["Sharp", 0xD1A0, ()=>cam.setI16(0xD1A0, tone10(recipe.sharpness))]);
  const nr = parseInt(recipe.nr,10);
  if(NR_ENC[nr]!=null) jobs.push(["NR", 0xD1A1, ()=>cam.setU16(0xD1A1, NR_ENC[nr])]);
  jobs.push(["Clarity", 0xD1A2, ()=>cam.setI16(0xD1A2, tone10(recipe.clarity))]);

  let ok=0, fail=0;
  for(const [label, , fn] of jobs){
    const done = await fn();
    logCam((done?"OK ":"NG ") + label);
    if(done) ok++; else fail++;
    await new Promise(r=>setTimeout(r,40));
  }
  logCam(`完成：成功 ${ok} / 失敗 ${fail}`);
  if(fail && !ok) throw new Error("全部寫入失敗，檢查連線模式");
}

async function getPhotoBlob(id){
  const db = await openDB();
  return new Promise((res,rej)=>{
    const q = db.transaction("p").objectStore("p").get(id);
    q.onsuccess = ()=>res(q.result||null);
    q.onerror = ()=>rej(q.error);
  });
}

async function shareCard(r){
  toast("產生分享圖…");
  let bmp = null;
  if((r.photos||[])[0]){
    const blob = await getPhotoBlob(r.photos[0]);
    if(blob){
      try { bmp = await createImageBitmap(blob, { imageOrientation: "from-image" }); }
      catch { bmp = await createImageBitmap(blob); }
    }
  }
  const maxW = 1600;
  const photoW = bmp ? Math.min(bmp.width, maxW) : 1080;
  const photoH = bmp ? Math.round(bmp.height * (photoW / bmp.width)) : 0;
  const pad = 56;
  const rows = [
    ["軟片模擬", r.filmSim],
    ["動態範圍", r.dr],
    ["顆粒效果", r.grain],
    ["彩色正片效果", r.colorChrome],
    ["彩色正片FX藍", r.colorChromeBlue],
    ["白平衡", r.wb==="色溫" ? ("色溫 "+(r.kelvin||"")+"K") : r.wb],
    ["白平衡偏移", "R "+r.shiftR+"   B "+r.shiftB],
    ["高光色調", r.highlight],["陰影色調", r.shadow],
    ["色彩", r.color],
    ["銳利度", r.sharpness],
    ["高感光度降噪", r.nr],
    ["清晰度", r.clarity],
    ["ISO", r.iso||"—"],
    ["曝光補償", r.ev||"—"]
  ];
  const rowH = 52;
  const titleH = 110;
  const w = Math.max(photoW + pad*2, 1000);
  const h = pad + titleH + (photoH ? photoH + 28 : 0) + 24 + rows.length*rowH + pad;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#161311";
  ctx.fillRect(0,0,w,h);
  ctx.fillStyle = "#f4eee4";
  ctx.fillRect(28, 28, w-56, h-56);
  ctx.fillStyle = "#e60012";
  ctx.beginPath(); ctx.arc(72, 78, 10, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#2a2218";
  ctx.font = "700 36px 'Noto Serif JP','Noto Serif TC',serif";
  ctx.textBaseline = "middle";
  ctx.fillText(r.name || "未命名食譜", 98, 78);
  ctx.font = "500 20px 'Noto Sans TC',sans-serif";
  ctx.fillStyle = "#7a6e62";
  ctx.fillText("富士食譜工具", 98, 112);
  let y = pad + titleH;
  if(bmp){
    const x = Math.round((w - photoW)/2);
    ctx.drawImage(bmp, x, y, photoW, photoH);
    y += photoH + 28;
  }
  ctx.strokeStyle = "#e0d2ba";
  rows.forEach(([k,v],i)=>{
    const yy = y + i*rowH;
    ctx.beginPath(); ctx.moveTo(pad, yy); ctx.lineTo(w-pad, yy); ctx.stroke();
    ctx.font = "500 22px 'Noto Sans TC',sans-serif";
    ctx.fillStyle = "#7a6e62";
    ctx.textAlign = "left";
    ctx.fillText(k, pad+8, yy + 32);
    ctx.font = "700 24px 'Noto Sans TC',sans-serif";
    ctx.fillStyle = "#2a2218";
    ctx.textAlign = "right";
    ctx.fillText(String(v??"—"), w-pad-8, yy + 32);
  });
  ctx.textAlign = "left";
  shutter();
  await new Promise((res,rej)=>c.toBlob(b=>{
    if(!b) return rej();
    downloadBlob(b,(r.name || "recipe")+".jpg");
    res();
  }, "image/jpeg", 0.92));
  toast("已下載分享圖");
}

function exportSettings(){
  const blob = new Blob([JSON.stringify({
    app: "富士食譜工具", version: 1, exportedAt: new Date().toISOString(),
    recipes: state.recipes.map(r => ({...r, photos: []}))
  }, null, 2)], {type:"application/json"});
  downloadBlob(blob,`fuji-recipes-${new Date().toISOString().slice(0,10)}.json`);
  toast("已匯出設定（不含照片）");
}
async function importSettings(file){
  try{
    const data = JSON.parse(await file.text());
    const incoming = data.recipes || data;
    if(!Array.isArray(incoming)) throw new Error("format");
    let n = 0;
    incoming.forEach(r=>{
      migrateRecipe(r); if(!r || !r.name) return;
      if(!r.id) r.id = uid();
      r.photos = [];
      r.updatedAt = Date.now();
      const i = state.recipes.findIndex(x=>x.id===r.id || x.name===r.name);
      if(i>=0) state.recipes[i] = {...state.recipes[i], ...r, photos: state.recipes[i].photos||[]};
      else state.recipes.unshift(r);
      n++;
    });
    save();
    if(cloudUser){
      for(const r of state.recipes) if(r.id!=="demo-gold") await cloudUpsert(r);
    }
    shutter(); toast(`已匯入 ${n} 道食譜`);
    renderList();
  }catch{ toast("匯入失敗，請確認 JSON"); }
}

async function clearAppCache(){
  if(!confirm("確定要清除快取並重新載入嗎？\n（食譜資料不會被刪除）")) return;
  toast("清理快取中…");
  try {
    // 1. 清除 Service Worker 快取 (Cache Storage)
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter(key=>/^fuji-recipe-v\d+$/.test(key)).map(key => caches.delete(key)));
    }
    // 2. 註銷 Service Worker 註冊
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      for (const reg of registrations) {
        if(reg.scope===new URL("./",location.href).href&&[reg.active,reg.waiting,reg.installing].some(worker=>worker?.scriptURL===new URL("sw.js",location.href).href))await reg.unregister();
      }
    }
    toast("快取已清除，正在重新載入…");
    setTimeout(() => {
      // 強制不從快取重新載入
      window.location.reload(true);
    }, 600);
  } catch (e) {
    console.error("Clear Cache Error:", e);
    window.location.reload(true);
  }
}

$("#btn-export").onclick = exportSettings;
$("#btn-import").onclick = () => $("#import-file").click();
$("#btn-clear-cache").onclick = clearAppCache;
$("#import-file").addEventListener("change", e=>{
  const f = e.target.files[0]; e.target.value=""; if(f) importSettings(f);
});


$("#login-form").addEventListener("submit", async e=>{
  e.preventDefault();
  $("#login-err").textContent = "";
  $("#login-err").classList.remove("ok");
  const email=$("#login-email").value.trim();
  const redirectTo = new URL("./", location.href).href;
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: redirectTo, shouldCreateUser: false }
  });
  if(error){
    $("#login-err").textContent = error.message;
    return;
  }
  $("#login-err").classList.add("ok");
  $("#login-err").textContent = "已寄出";
});
$("#btn-auth").onclick = async ()=>{
  if(cloudUser){
    if(confirm("登出後這台只留本機食譜，不再同步。")){
      await sb.auth.signOut();
      cloudUser = null;
      location.reload();
    }
    return;
  }
  $("#gate").classList.add("show");
};
$("#gate").addEventListener("click", e=>{ if(e.target.id==="gate") $("#gate").classList.remove("show"); });
sb.auth.onAuthStateChange((_evt, session)=>{
  if(session && session.user) afterLogin(session);
  else cloudUser = null;
});


// 介面主題：與「拍立得小房間」共用同一個設定（同一個網域下互通）
(function(){
  const KEY='polaroid-room-theme';
  const sel=document.getElementById('theme-select');
  const themeColor=document.querySelector('meta[name="theme-color"]');
  function colorOfDesk(){
    return getComputedStyle(document.documentElement).getPropertyValue('--desk').trim() || '#000';
  }
  function apply(t){
    document.documentElement.setAttribute('data-theme', t);
    if (sel && sel.value!==t) sel.value=t;
    if (themeColor) themeColor.setAttribute('content', colorOfDesk());
    try { localStorage.setItem(KEY, t); } catch(e) {}
  }
  const current=document.documentElement.getAttribute('data-theme')||'oled';
  if (sel) sel.value=current;
  if (themeColor) themeColor.setAttribute('content', colorOfDesk());
  if (sel) sel.addEventListener('change', ()=>apply(sel.value));
})();

// 手機捲動時暫停背景光斑動畫（省電）
(function(){
  let scrolling=false, idleTimer=0;
  window.addEventListener('scroll', ()=>{
    if (window.innerWidth>859) return;
    if (!scrolling) { scrolling=true; document.body.classList.add('page-scrolling'); }
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>{ scrolling=false; document.body.classList.remove('page-scrolling'); }, 180);
  }, {passive:true});
})();

renderList();
sb.auth.getSession().then(({data})=>{
  if(data && data.session) afterLogin(data.session);
});
if (location.protocol !== "file:" && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
